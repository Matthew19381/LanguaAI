name: CI — LinguaAI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run backend tests
        env:
          TESTING: "1"
          GEMINI_API_KEY: "test-key"
          OPENROUTER_API_KEY: "test-key"
          SECRET_KEY: "ci-test-secret"
        run: |
          python -m pytest backend/tests/ -v --tb=short -q 2>&1 | tail -30

  # ── Frontend Build ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8001

  # ── E2E Tests ──────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend and run E2E tests
        working-directory: ./frontend
        env:
          TESTING: "1"
          GEMINI_API_KEY: "test-key"
          OPENROUTER_API_KEY: "test-key"
          SECRET_KEY: "ci-test-secret"
          VITE_API_URL: http://localhost:8001
        run: |
          # Start backend in background (kept alive for the whole step)
          (cd .. && TESTING=1 GEMINI_API_KEY=test-key OPENROUTER_API_KEY=test-key SECRET_KEY=ci-test-secret \
            python -m uvicorn backend.main:app --port 8001 > /tmp/uvicorn.log 2>&1 & echo $! > /tmp/uvicorn.pid)

          # Wait for backend health (up to 30s) instead of a fixed sleep
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/health >/dev/null 2>&1; then
              echo "Backend is up after ${i}s"
              break
            fi
            sleep 1
          done

          # Fail loudly if backend never came up
          curl -fsS http://localhost:8001/api/health || { echo "Backend failed to start"; cat /tmp/uvicorn.log; kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null; exit 1; }

          npx playwright test --reporter=list 2>&1 | tail -40
          PW_EXIT=${PIPESTATUS[0]}
          kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
          exit $PW_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  # ── Lint & Code Quality ────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint backend code
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
