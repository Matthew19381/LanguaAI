version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: linguaai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lingua_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lingua_ai
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - BACKEND_URL=http://localhost:8001
      - FRONTEND_URL=http://localhost:5173
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - lingua_ai_audio:/app/backend/audio
      - lingua_ai_exports:/app/backend/exports
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    args:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Daily DB backup (runs at 3 AM daily, keeps 7 days)
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[backup] Running daily backup..."
          python -m backend.services.backup_service
          echo "[backup] Done. Sleeping 24h..."
          sleep 86400
        done
    volumes:
      - lingua_ai_backups:/app/backups
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lingua_ai_audio:
  lingua_ai_exports:
  lingua_ai_backups:
  pgdata: