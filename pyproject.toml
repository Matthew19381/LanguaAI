[project]
name = "lingua-ai"
version = "1.0.0"
description = "AI-powered language learning platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.35",
    "pydantic-settings>=2.5.0",
    "google-genai>=1.56.0",
    "edge-tts>=7.0.2",
    "genanki>=0.13.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "fpdf2>=2.7.9",
    "feedparser>=6.0.11",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.147.0",
    "fsrs>=6.3.1",
    "pywebpush>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "node_modules*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120
# Alembic migration files are autogenerated — don't style-gate them (env.py is
# still checked). The revision graph must stay intact regardless of import order.
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101", # missing-type-self
    "ANN102", # missing-type-cls
    "ANN",    # type annotations — intentionally not enforced (would touch ~120 signatures)
    "B008",   # function call in argument defaults (FastAPI Depends() is the standard pattern)
    "E501",   # line too long — 120 limit is intentional; autofix breaks long URLs/strings
    "E402",   # module-level import not at top (required by alembic/env.py)
    "E701",   # multiple statements on one line (common FastAPI one-liners)
    "B904",   # raise without from — intentional; not chaining exceptions project-wide
    "E741",   # ambiguous variable name (l/I/O) — occasional, low risk
    "B017",   # blind except in tests — intentional (assert raises Exception)
    "UP",     # pyupgrade — changes syntax (e.g. datetime.timezone -> UTC); autofix broke a test
    "E712",   # comparison to True/False/None literal — stylistic
    "E711",   # comparison to None using == — stylistic (use is/is not)
    "W",      # whitespace rules (W291/W292/W293) — formatting, handled by ruff format
    "F541",   # f-string without placeholders — stylistic
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["ANN", "F841"]  # Don't require annotations; allow unused vars in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
