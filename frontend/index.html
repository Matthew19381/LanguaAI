<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LinguaAI - Nauka Języków</title>
  <meta name="description" content="Personalizowana nauka języków: lekcje, fiszki i ćwiczenia z powtórkami w odstępach.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!-- iOS: standalone mode + home-screen icon (PNG, no transparency) -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinguaAI">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Theme class before first paint, also on pages outside Layout (/placement,
       /login-as), which never ran useDarkMode and showed dark text on a dark page. -->
  <script>
    (function () {
      var dark = true
      try { dark = localStorage.getItem('linguaai_dark_mode') !== 'false' } catch (e) {}
      document.documentElement.classList.add(dark ? 'dark' : 'light')
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
